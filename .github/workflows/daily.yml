name: daily-radar

on:
  schedule:
    - cron: "17 1 * * *"   # 每天 UTC 01:17（北京时间 09:17）
  workflow_dispatch:
    inputs:
      ai_limit:
        description: "本次最多分类多少个项目（留空使用配置，首次验证可填 5）"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test classifier
        run: python -m unittest discover -s tests -v

      - name: Run radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_MAX_PER_RUN: ${{ inputs.ai_limit }}
        run: |
          radar_args=()
          if [ -n "$AI_MAX_PER_RUN" ]; then
            radar_args+=(--ai-limit "$AI_MAX_PER_RUN")
          fi
          python -m radar "${radar_args[@]}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs README.md
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "radar: $(date -u +%F)"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
