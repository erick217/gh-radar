<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
{% assign meta_title = page.title | default: site.title %}
{% assign meta_desc = page.description | default: site.description %}
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ meta_desc | escape }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ meta_title | escape }}">
<meta property="og:description" content="{{ meta_desc | escape }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function () {
  try {
    var saved = localStorage.getItem("radar-theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="{{ '/assets/css/system-theme.css' | relative_url }}?v={{ site.github.build_revision }}">
<script defer src="{{ '/assets/js/radar-ui.js' | relative_url }}?v={{ site.github.build_revision }}"></script>
